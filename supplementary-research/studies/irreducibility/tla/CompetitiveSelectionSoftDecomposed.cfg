SPECIFICATION Spec
\* WeightTotal is 4 here; the canonical configuration sets 12. The
\* divergence does not touch what this instrument measures: over three
\* candidates each holding at least one unit, Withdraw requires
\* weights[from] - amount > 0 with amount > 0, so some candidate must hold at
\* least 2 -- a total of 3 cannot give that and 4 can, so 4 is the smallest
\* size at which the mid-transfer shortfall is reachable at all.
CONSTANT WeightTotal = 4
INVARIANT Normalization
CHECK_DEADLOCK FALSE
