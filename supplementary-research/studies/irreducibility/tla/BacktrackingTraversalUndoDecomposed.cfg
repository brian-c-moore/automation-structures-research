\* Same bounds and same group binding as
\* formal/structures/BacktrackingTraversal/BacktrackingTraversalUndo.cfg.
\* Targets Pairing, the invariant
\* the pinned decomposition of this entry breaks; this instrument carries the
\* same split against the enriched model.
SPECIFICATION Spec

CONSTANTS
    BranchFactor = 2
    MaxDepth = 3
    InitAux = 0
    AuxDomain = {0, 1, 2}
    Deltas = {1, 2}

Mutate <- MutateImpl
Undo <- UndoImpl

CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT Pairing
\* Both obligations are checked. The split violates Pairing while
\* StateRestoration survives, and that independence is measured only if both
\* are evaluated. StateRestoration is listed after Pairing, so Pairing stays
\* the reported violation.
INVARIANT StateRestoration
