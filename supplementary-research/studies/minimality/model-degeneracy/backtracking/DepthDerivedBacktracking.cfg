\* Bounded safety instance for the depth-derived target. This configuration
\* checks four state predicates; it makes no liveness or refinement claim.
CONSTANTS
    BranchFactor = 2
    MaxDepth = 3
    InitAux = 0

INIT Init
NEXT Next
CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT DepthCoupling
INVARIANT DerivedStack
INVARIANT RecordedLeavesValid
