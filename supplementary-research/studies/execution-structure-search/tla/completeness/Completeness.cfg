\* The completeness search is bounded: a wider Units parameter broadens
\* the empirical support and does not turn the search into a proof.
\* Under StreamGraph mode the state space is linear in |Units|; under
\* ForkJoin/StepGraph it is 3^|Units|. The search completes well under
\* any reasonable bound with `-workers auto`.
CONSTANTS
    Units = {u1, u2, u3, u4, u5, u6, u7, u8, u9, u10, u11, u12}
    Modality = "StreamGraph"

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT FourModalitiesExhaustive
