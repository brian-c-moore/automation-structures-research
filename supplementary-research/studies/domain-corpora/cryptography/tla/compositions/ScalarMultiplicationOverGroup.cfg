\* Bounded parameters per the study definition
\* ScalarBits = 4 is exhaustive over a 4-bit scalar;
\* |GroupElement| = 4 (cyclic group Z/4Z) keeps the state space small.
\* The .tla defines the concrete topology (GroupElement, GroupIdentity,
\* BasePoint) and content (GroupOp, Scalar, RoundFn, inputs); the .cfg
\* only supplies model values.

CONSTANTS
    g0 = g0
    g1 = g1
    g2 = g2
    g3 = g3
    ScalarBits = 4

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT HistoryStartsAtIdentity
INVARIANT ChainedAccCorrect
INVARIANT HistoryConsistent
