\* Bounded parameters per the study definition.
\* ChainLength = 4 is exhaustive at 4 chain steps;
\* |State| = 3 and |Input| = 3 keep the state space small.
\* The .tla defines the concrete topology (State, Input, InitialState)
\* and content (RoundFn, inputs); the .cfg only supplies model values.

CONSTANTS
    s0 = s0
    s1 = s1
    s2 = s2
    x1 = x1
    x2 = x2
    x3 = x3
    ChainLength = 4

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT HistoryStartsAtInit
INVARIANT ChainedStateCorrect
INVARIANT HistoryConsistent
