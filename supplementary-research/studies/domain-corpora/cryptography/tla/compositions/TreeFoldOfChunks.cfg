\* Bounded parameters per the study definition.
\* NumChunks = 4 (tree depth 2) is exhaustive.
\* |ChainingValue| = 3 keeps the state space small.
\* The .tla defines ChainingValue, ChunkCV, and CompressionFn; the
\* .cfg only supplies model values.

CONSTANTS
    c0 = c0
    c1 = c1
    c2 = c2
    NULL_CV = NULL_CV
    NumChunks = 4

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT UniqueAtPosition
INVARIANT LevelConsistency
INVARIANT LeavesAreInputs
