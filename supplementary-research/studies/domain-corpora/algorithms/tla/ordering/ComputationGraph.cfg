\* ComputationGraph substrate. Expected PASS.
\* MaxEdge = 12 = |PossibleEdges| for 4 nodes -> exhaustive enumeration
\* of every directed graph on 4 nodes. PrimIds singleton: pmap is
\* irrelevant to ordering, so it is held constant to keep the
\* enumeration over graph SHAPES (no pmap state blowup).
CONSTANTS
    MaxNode = 4
    MaxEdge = 12
    PrimIds = {P}

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT WellFormed
