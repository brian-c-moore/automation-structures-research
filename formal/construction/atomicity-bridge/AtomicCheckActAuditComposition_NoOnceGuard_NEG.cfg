\* Required to VIOLATE AuditUnique. Cap = 2 is exactly large enough for
\* one invoker to commit twice, which is the violation under test; the
\* ceiling is never the failure.
CONSTANTS
    Invokers = {a, b, c}
    Cap = 2

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT AuditUnique
