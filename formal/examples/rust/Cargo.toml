[workspace]
members = [
  "crates/formal-example-structures",
  "crates/formal-example-domains",
  "crates/formal-example-algorithms",
  "crates/formal-example-runner",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
automation-structures = { version = "=0.4.0", features = ["proof-api"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[profile.dev]
debug = 1

[profile.release]
overflow-checks = true
