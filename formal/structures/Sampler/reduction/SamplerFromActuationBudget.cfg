\* Same bounds as Sampler.cfg (Items = {i1,i2,i3,i4},
\* SampleSize = 2, MaxProb = 3) so the refinement is checked
\* apples-to-apples against the target's own model.
CONSTANTS
    Items = {i1, i2, i3, i4}
    SampleSize = 2
    MaxProb = 3

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT ActScope
INVARIANT ActFidelity
INVARIANT ActCompleteness
INVARIANT BudgetSafety

PROPERTY SamplerRefinement
