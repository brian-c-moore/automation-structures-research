\* Signal's finite value/listener instance with AuditSink's log bound. HashC
\* realizes the abstract hash, and all three component obligations are checked.
CONSTANTS
    Values = {v1, v2, v3}
    Listeners = {l1, l2}
    InitialValue = v1
    MaxLogLen = 4

Hash <- HashC

CHECK_DEADLOCK FALSE

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT ChainIntegrity
INVARIANT HashConsistency
INVARIANT HashBindsContent

PROPERTY SigRefinement
