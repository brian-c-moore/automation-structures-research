\* Three-node path. Two rounds are required for a value change at node 1 to
\* affect node 3, which distinguishes snapshot rounds from live-value updates.
\* Edges is supplied by definition override because the configuration syntax
\* cannot directly bind this tuple set.
CONSTANTS
    Nodes = {1, 2, 3}
    MaxIterations = 3
    MaxValue = 2

Edges <- EdgesPath

SPECIFICATION Spec

INVARIANT TypeInvariant
INVARIANT IterationBound
INVARIANT SnapshotLocality

PROPERTY EventualSettledOrIterationLimit
