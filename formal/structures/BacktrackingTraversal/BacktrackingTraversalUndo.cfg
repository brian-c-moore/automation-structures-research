\* Finite decision tree with a three-element auxiliary domain. Mutate and Undo
\* are definition overrides; their closure and round-trip law are proof
\* premises of the parameterized carrier.
CONSTANTS
    BranchFactor = 2
    MaxDepth = 3
    InitAux = 0
    AuxDomain = {0, 1, 2}
    Deltas = {1, 2}

Mutate <- MutateImpl
Undo <- UndoImpl

INIT Init
NEXT Next
CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT Pairing
INVARIANT StateRestoration
INVARIANT RecordedLeafValidity
