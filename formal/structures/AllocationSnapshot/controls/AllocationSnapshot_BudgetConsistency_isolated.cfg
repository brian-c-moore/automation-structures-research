\* Positive-isolated configuration for the BudgetConsistency control. Only
\* BudgetConsistency is declared, so its result is not conflated with another
\* invariant.

CONSTANTS
    Nodes = {n1, n2, n3}
    BudgetCapacity = 6
INIT Init
NEXT Next
CHECK_DEADLOCK FALSE

INVARIANT BudgetConsistency
