CONSTANTS
    Candidates = {"c1", "c2", "c3"}
    CandidateOrder <- ConfiguredCandidateOrder
    WeightTotal = 12
    MaxScore = 3

INIT Init
NEXT MutableScoreNext

\* AssignNext's WSum[WN] < WeightTotal guard disables every award once the
\* running total reaches WeightTotal, but UpdateScore carries no guard, so
\* MutableScoreNext is enabled in every state and no deadlock state exists here. The
\* setting is inert in this model. It is load-bearing in the immutable-score
\* sibling, whose Next is AssignNext alone and whose terminal state deadlocks.
CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT NonNegativity
INVARIANT BoundedTotal
INVARIANT Normalization
INVARIANT UniversalContribution
INVARIANT ScoreOrderPreservation
INVARIANT TieBoundedness
