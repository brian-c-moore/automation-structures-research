\* Parameterization control: the same StepGraph.tla obligations are checked
\* under a linear topology rather than the diamond topology in StepGraph.cfg.
\*
\* A reachable state space distinct from the diamond configuration checks that
\* the topology substitution affects the model.
CONSTANTS
    Nodes <- LinearNodes
    Edges <- LinearEdges

INIT Init
NEXT Next

CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT EligibilityClosed
INVARIANT ValidStates
PROPERTY ProgressMonotonic
