# Smoke check: the verifier image builds and a focused proof selection runs.
name: proofs-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build verifier image
        run: docker build --tag automation-structures-proofs verification
      - name: Discovery dry run
        run: >
          docker run --rm --init --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --cpus 2 --memory 4g --memory-swap 4g
          --pids-limit 512 --volume "$PWD:/source/automation-structure-research:ro"
          --tmpfs /work:rw,exec,nosuid,nodev,size=2g,mode=1777
          automation-structures-proofs
          run --scope all --all --dry-run --no-selection-table
      - name: Budget subject
        run: >
          docker run --rm --init --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --cpus 2 --memory 4g --memory-swap 4g
          --pids-limit 512 --volume "$PWD:/source/automation-structure-research:ro"
          --tmpfs /work:rw,exec,nosuid,nodev,size=2g,mode=1777
          automation-structures-proofs
          run --subject Budget --workers 1 --fail-fast --no-selection-table
